<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Direção B — Ferramenta limpa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; font-size: 14px;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 20px; min-height: 52px; border-bottom: 1px solid {{t.line}}; background: {{t.panel}};">
    <span style="font-weight: 600;">Own Expeditor</span>
    <span style="color: {{t.muted}};">/</span>
    <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}};">Perfil 1 · Save 4
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div style="flex-grow: 1;"></div>
    <button type="button" onClick="{{toggle}}" aria-label="{{themeLabel}}" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" style="min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}};">PT · EN</button>
  </header>
  <div style="display: flex; flex-wrap: wrap; flex-grow: 1;">
    <nav aria-label="Módulos" style="flex: 1 1 180px; max-width: 200px; box-sizing: border-box; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid {{t.line}};">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <button type="button" style="{{n.style}}">{{n.label}}<span style="margin-left: auto; color: {{t.muted}}; font-size: 12px; font-variant-numeric: tabular-nums;">{{n.count}}</span></button>
      </sc-for>
    </nav>
    <main style="flex: 999 1 560px; min-width: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <h1 style="margin: 0; font-size: 18px; font-weight: 600;">Ofertas de frete</h1>
        <span style="padding: 2px 8px; border-radius: 999px; background: {{t.chip}}; color: {{t.muted}}; font-size: 12px; font-variant-numeric: tabular-nums;">6.485</span>
        <div style="flex-grow: 1;"></div>
        <label for="busca-b" style="position: absolute; left: -9999px;">Filtrar</label>
        <input id="busca-b" type="search" placeholder="Filtrar…" style="width: 240px; min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.text}}; font: inherit;">
      </div>
      <div style="overflow-x: auto; border: 1px solid {{t.line}}; border-radius: 8px; background: {{t.panel}};">
        <div style="min-width: 640px;">
          <div style="display: grid; grid-template-columns: 1.2fr 1.2fr 1.4fr 1fr 80px; gap: 12px; padding: 10px 14px; border-bottom: 1px solid {{t.line}}; color: {{t.muted}}; font-size: 12px; font-weight: 500;">
            <span>Origem</span><span>Destino</span><span>Carga</span><span>Reboque</span><span style="text-align: right;">Distância</span>
          </div>
          <sc-for list="{{offers}}" as="o" hint-placeholder-count="6">
            <button type="button" onClick="{{o.pick}}" style="{{o.style}}">
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{o.from}}</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{o.to}}</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{o.cargo}}</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{t.muted}};">{{o.trailer}}</span>
              <span style="text-align: right; font-variant-numeric: tabular-nums;">{{o.km}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </main>
    <aside aria-label="Detalhes" style="flex: 1 1 300px; max-width: 340px; box-sizing: border-box; padding: 20px; border-left: 1px solid {{t.line}}; background: {{t.panel}}; display: flex; flex-direction: column; gap: 14px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Editar oferta</h2>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 12px; color: {{t.muted}}; font-weight: 500;">{{f.label}}</span>
          <button type="button" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.text}}; text-align: left;">{{f.value}}
            <svg aria-hidden="true" style="margin-left: auto;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </sc-for>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid {{t.line}}; color: {{t.muted}};"><span>Distância</span><span style="color: {{t.text}}; font-weight: 600; font-variant-numeric: tabular-nums;">{{selKm}}</span></div>
      <div style="flex-grow: 1;"></div>
      <button type="button" style="min-height: 40px; border-radius: 6px; border: none; background: {{t.accent}}; color: #ffffff; font-weight: 600;">Revisar mudanças (1)</button>
      <span style="font-size: 12px; color: {{t.muted}};">Backup automático antes de gravar.</span>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0, dark: null }; }
  renderVals() {
    const dark = this.state.dark ?? (this.props.dark ?? false);
    const t = dark
      ? { bg:'#18181b', panel:'#1f1f23', line:'#2e2e33', text:'#f4f4f5', muted:'#a1a1aa', accent:'#3b82f6', chip:'#2e2e33', sel:'#1e2a44', hover:'#26262b' }
      : { bg:'#fafafa', panel:'#ffffff', line:'#e4e4e7', text:'#18181b', muted:'#52525b', accent:'#2563eb', chip:'#f4f4f5', sel:'#eff4ff', hover:'#f4f4f5' };
    const data = [
      { from:'Radus · Sofia', to:'LogNStick · Istanbul', cargo:'Vigas de concreto', trailer:'Prancha', km:'569 km' },
      { from:'Rock Eat · Beograd', to:'Radus · Sofia', cargo:'Tanque de água', trailer:'Baú', km:'394 km' },
      { from:'Trameri · Wien', to:'Tradeaux · Praha', cargo:'Maquinário', trailer:'Rebaixado', km:'332 km' },
      { from:'Posped · Berlin', to:'Eurogoodies · Hamburg', cargo:'Eletrônicos', trailer:'Baú refrigerado', km:'289 km' },
      { from:'Fle · Lyon', to:'Quarry · Milano', cargo:'Vinho', trailer:'Tanque', km:'441 km' },
      { from:'Tree-ET · Graz', to:'Sellplan · Ljubljana', cargo:'Madeira', trailer:'Florestal', km:'176 km' }
    ];
    const sel = this.state.sel;
    const offers = data.map((o, i) => ({ ...o, pick: () => this.setState({ sel: i }),
      style: `display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr 1fr 80px;gap:12px;align-items:center;width:100%;min-height:44px;padding:0 14px;border:none;border-bottom:1px solid ${t.line};background:${i===sel?t.sel:'transparent'};color:${t.text};text-align:left;box-shadow:${i===sel?'inset 3px 0 0 '+t.accent:'none'};` }));
    const s = data[sel];
    const nav = [['Fretes','6.485'],['Caminhões','4'],['Perfil',''],['Empresa','237'],['Mapa','']].map(([n,c], i) => ({ label:n, count:c,
      style:`display:flex;align-items:center;min-height:40px;padding:0 10px;border-radius:6px;border:none;text-align:left;background:${i===0?t.chip:'transparent'};color:${i===0?t.text:t.muted};font-weight:${i===0?600:500};` }));
    return { t, offers, nav, selKm: s.km,
      fields: [ {label:'Origem', value:s.from}, {label:'Destino', value:s.to}, {label:'Carga', value:s.cargo}, {label:'Reboque', value:s.trailer} ],
      themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
      toggle: () => this.setState({ dark: !dark }) };
  }
}
</script>
</body>
</html>
