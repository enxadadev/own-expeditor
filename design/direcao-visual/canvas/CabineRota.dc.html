<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Direção A+C — Cabine com rota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f5a524}a:hover{color:#ffc35c}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 820px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: Barlow, system-ui, sans-serif; font-size: 14px;">
  <nav aria-label="Módulos" style="flex: 0 0 76px; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: {{t.side}}; border-right: 1px solid {{t.line}};">
    <div style="width: 40px; height: 40px; border-radius: 10px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button type="button" aria-label="{{n.label}}" style="{{n.style}}">
        <span style="width: 18px; height: 3px; border-radius: 2px; background: {{n.bar}};"></span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em;">{{n.short}}</span>
      </button>
    </sc-for>
    <div style="flex-grow: 1;"></div>
    <button type="button" onClick="{{toggle}}" aria-label="{{themeLabel}}" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" aria-label="Idioma" style="width: 48px; height: 36px; border-radius: 10px; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 600;">PT</button>
  </nav>
  <section aria-label="Ofertas" style="flex: 1 1 340px; max-width: 380px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid {{t.line}};">
    <div style="display: flex; align-items: flex-end; gap: 10px; padding: 0 4px 4px;">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 12px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.08em;">Perfil 1 · Save 4</span>
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;">Fretes</h1>
      </div>
      <div style="flex-grow: 1;"></div>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{t.muted}};">6.485</span>
    </div>
    <label for="busca-ac" style="position: absolute; left: -9999px;">Buscar oferta</label>
    <input id="busca-ac" type="search" placeholder="Cidade, empresa ou carga…" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.text}}; font: inherit;">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="6">
      <button type="button" onClick="{{o.pick}}" style="{{o.style}}">
        <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
          <span style="font-weight: 600;">{{o.from}}</span>
          <svg aria-hidden="true" width="26" height="8" viewBox="0 0 26 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"><path d="M1 4h24"/></svg>
          <span style="font-weight: 600;">{{o.to}}</span>
          <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{o.kmColor}};">{{o.km}} km</span>
        </div>
        <span style="color: {{t.muted}}; font-size: 13px;">{{o.cargo}} · {{o.trailer}}</span>
      </button>
    </sc-for>
  </section>
  <main style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="position: relative; border-radius: 16px; overflow: hidden; background: {{t.map}}; border: 1px solid {{t.line}};">
      <svg role="img" aria-label="Mapa da rota de {{s.from}} até {{s.to}}" width="100%" height="340" viewBox="0 0 800 340" preserveAspectRatio="xMidYMid meet">
        <g stroke="{{t.grid}}" stroke-width="1">
          <path d="M0 68H800M0 136H800M0 204H800M0 272H800M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340"/>
        </g>
        <sc-for list="{{cities}}" as="c" hint-placeholder-count="12">
          <circle cx="{{c.x}}" cy="{{c.y}}" r="3" fill="{{t.cityDot}}"/>
          <text x="{{c.lx}}" y="{{c.ly}}" fill="{{t.cityText}}" font-size="11" font-family="Barlow, sans-serif">{{c.name}}</text>
        </sc-for>
        <path d="{{route.d}}" fill="none" stroke="{{t.routeGlow}}" stroke-width="12" stroke-linecap="round"/>
        <path d="{{route.d}}" fill="none" stroke="{{t.accent}}" stroke-width="4" stroke-linecap="round"/>
        <circle cx="{{route.ax}}" cy="{{route.ay}}" r="9" fill="{{t.map}}" stroke="{{t.accent}}" stroke-width="4"/>
        <circle cx="{{route.bx}}" cy="{{route.by}}" r="10" fill="{{t.accent}}"/>
      </svg>
      <div style="position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 10px; background: {{t.overlay}}; border: 1px solid {{t.line}};">
        <span style="font-size: 11px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.08em;">Rota</span>
        <span style="font-weight: 600;">{{s.co}} · {{s.from}} → {{s.dco}} · {{s.to}}</span>
      </div>
      <div style="position: absolute; right: 16px; bottom: 14px; padding: 6px 12px; border-radius: 10px; background: {{t.overlay}}; border: 1px solid {{t.line}}; display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{t.accent}};">{{s.km}}</span>
        <span style="color: {{t.muted}};">km</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{stats}}" as="st" hint-placeholder-count="4">
        <div style="padding: 12px 14px; border-radius: 12px; background: {{t.panel}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.08em;">{{st.label}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;">{{st.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 8px 12px; border-radius: 10px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; text-align: left;">
          <span style="font-size: 11px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.08em;">{{f.label}}</span>
          <span style="font-weight: 600;">{{f.value}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <span style="font-size: 13px; color: {{t.muted}};">Nada é gravado sem revisão. Um backup é criado antes.</span>
      <div style="flex-grow: 1;"></div>
      <button type="button" style="min-height: 48px; padding: 0 22px; border-radius: 10px; border: none; background: {{t.accent}}; color: #1a1206; font-weight: 700; letter-spacing: 0.03em;">Revisar mudanças</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0, dark: null }; }
  renderVals() {
    const dark = this.state.dark ?? (this.props.dark ?? true);
    const t = dark
      ? { bg:'#121417', side:'#0c0e10', panel:'#1a1d21', line:'#2a2f35', text:'#eef0f2', muted:'#9aa3ad', accent:'#f5a524', sel:'#2a2414', map:'#101316', grid:'#1a1f24', cityDot:'#55606b', cityText:'#7d8792', routeGlow:'rgba(245,165,36,0.18)', overlay:'rgba(18,20,23,0.88)' }
      : { bg:'#f4f2ee', side:'#ebe7df', panel:'#ffffff', line:'#d9d3c7', text:'#1b1d20', muted:'#5f6670', accent:'#b86e00', sel:'#fbecd2', map:'#efebe3', grid:'#e2dccf', cityDot:'#a39a8a', cityText:'#6e6656', routeGlow:'rgba(184,110,0,0.16)', overlay:'rgba(255,255,255,0.92)' };
    const geo = { Lisboa:[-9.14,38.72], Madrid:[-3.70,40.42], Paris:[2.35,48.86], Calais:[1.86,50.95], London:[-0.13,51.51], Lyon:[4.84,45.76], Milano:[9.19,45.46], Berlin:[13.40,52.52], Hamburg:[9.99,53.55], Praha:[14.42,50.08], Wien:[16.37,48.21], Graz:[15.44,47.07], Ljubljana:[14.51,46.06], Beograd:[20.46,44.79], Sofia:[23.32,42.70], Istanbul:[28.98,41.01], Warszawa:[21.01,52.23], Roma:[12.50,41.90] };
    const proj = ([lon, lat]) => [Math.round(60 + (lon + 10) * 18.5), Math.round(330 - (lat - 37) * 17.5)];
    const data = [
      { from:'Sofia', to:'Istanbul', co:'Radus', dco:'LogNStick', cargo:'Vigas de concreto', trailer:'Prancha', km:'569', exp:'12h 14min', ferry:'—', units:'2' },
      { from:'Beograd', to:'Sofia', co:'Rock Eat', dco:'Radus', cargo:'Tanque de água', trailer:'Baú', km:'394', exp:'10h 19min', ferry:'—', units:'1' },
      { from:'Wien', to:'Praha', co:'Trameri', dco:'Tradeaux', cargo:'Maquinário', trailer:'Rebaixado', km:'332', exp:'8h 02min', ferry:'—', units:'1' },
      { from:'Calais', to:'London', co:'Fle', dco:'Tesco', cargo:'Frutas', trailer:'Refrigerado', km:'166', exp:'5h 40min', ferry:'1h 30min', units:'18' },
      { from:'Lyon', to:'Milano', co:'Fle', dco:'Quarry', cargo:'Vinho', trailer:'Tanque', km:'441', exp:'9h 55min', ferry:'—', units:'1' },
      { from:'Berlin', to:'Warszawa', co:'Posped', dco:'Eurogoodies', cargo:'Eletrônicos', trailer:'Baú', km:'574', exp:'11h 03min', ferry:'—', units:'6' }
    ];
    const sel = this.state.sel;
    const offers = data.map((o, i) => ({ ...o, pick: () => this.setState({ sel: i }), kmColor: i===sel ? t.accent : t.text,
      style: `display:flex;flex-direction:column;gap:3px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid ${i===sel?t.accent:t.line};background:${i===sel?t.sel:t.panel};color:${t.text};text-align:left;` }));
    const s = data[sel];
    const [ax, ay] = proj(geo[s.from]); const [bx, by] = proj(geo[s.to]);
    const mx = (ax + bx) / 2, my = (ay + by) / 2, dx = bx - ax, dy = by - ay;
    const cx = Math.round(mx - dy * 0.18), cy = Math.round(my + dx * 0.18);
    const route = { ax, ay, bx, by, d: `M${ax} ${ay} Q${cx} ${cy} ${bx} ${by}` };
    const cities = Object.entries(geo).map(([name, g]) => { const [x, y] = proj(g); return { name, x, y, lx: x + 6, ly: y - 6 }; });
    const nav = [['Fretes','FRETES'],['Caminhões','FROTA'],['Perfil','PERFIL'],['Empresa','EMPRESA'],['Mapa','MAPA']].map(([l, sh], i) => ({ label:l, short:sh, bar: i===0 ? t.accent : 'transparent',
      style:`width:60px;min-height:52px;border-radius:10px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:${i===0?t.panel:'transparent'};color:${i===0?t.text:t.muted};` }));
    return { t, s, offers, nav, route, cities,
      stats: [ {label:'Expira em', value:s.exp}, {label:'Balsa', value:s.ferry}, {label:'Unidades', value:s.units}, {label:'Urgência', value:'Normal'} ],
      fields: [ {label:'Origem', value:`${s.co} · ${s.from}`}, {label:'Destino', value:`${s.dco} · ${s.to}`}, {label:'Carga', value:s.cargo}, {label:'Reboque', value:s.trailer} ],
      themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
      toggle: () => this.setState({ dark: !dark }) };
  }
}
</script>
</body>
</html>
