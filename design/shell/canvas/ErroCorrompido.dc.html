const TH = {
  dark:  { bg:'#121417', side:'#0c0e10', panel:'#1a1d21', line:'#2a2f35', text:'#eef0f2', muted:'#9aa3ad', accent:'#f5a524', sel:'#2a2414', map:'#101316', grid:'#1a1f24', danger:'#f87171', dangerBg:'rgba(248,113,113,0.10)', success:'#4ade80', onAccent:'#1a1206', tool:'#0c0e10' },
  light: { bg:'#f4f2ee', side:'#ebe7df', panel:'#ffffff', line:'#d9d3c7', text:'#1b1d20', muted:'#5f6670', accent:'#b86e00', sel:'#fbecd2', map:'#efebe3', grid:'#e2dccf', danger:'#b42318', dangerBg:'rgba(180,35,24,0.07)', success:'#157f3b', onAccent:'#1a1206', tool:'#e3ded3' }
};
const ICONS = {
  jobs: 'M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z M4 7.5l8 4.5 8-4.5 M12 12v9',
  fleet: 'M3 7h11v9H3z M14 10h4l3 3v3h-7 M5 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0 M15 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0',
  profile: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.5-6 8-6s8 2 8 6',
  company: 'M4 21V5l8-2v18 M12 8h8v13 M4 21h16 M7 9h2 M7 13h2 M7 17h2 M15 12h2 M15 16h2',
  map: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z M9 4v14 M15 6v14',
  settings: 'M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4'
};
function fmt(s, ...a) { return String(s).replace(/\{(\d)(?::[A-Z0-9]+)?\}/g, (m, i) => a[i]); }
function btnPrimary(t, disabled) {
  return `min-height:48px;padding:0 22px;border-radius:10px;border:none;font-weight:700;letter-spacing:0.03em;background:${disabled ? t.line : t.accent};color:${disabled ? t.muted : t.onAccent};`;
}
function btnSecondary(t) {
  return `min-height:48px;padding:0 18px;border-radius:10px;border:1px solid ${t.line};background:transparent;color:${t.text};font-weight:600;`;
}
function resolveTheme(c) {
  const pref = c.state.pref || (c.props.dark === false ? 'light' : 'dark');
  const sys = (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
  const dark = pref === 'system' ? sys : pref === 'dark';
  return { pref, dark, t: dark ? TH.dark : TH.light };
}
// o: { active, session, chips, error, pend, running, game, profile, save, variants, mainLabel }
function shellVals(c, o) {
  const { pref, dark, t } = resolveTheme(c);
  const lang = c.state.lang || 'pt';
  const tx = STR[lang];
  const sess = !!o.session;
  const chips = sess || !!o.chips;
  const pend = o.pend || 0;
  const running = !!o.running;
  const modIds = ['jobs', 'fleet', 'profile', 'company', 'map'];
  const itemStyle = (active, enabled) => `width:60px;min-height:60px;border-radius:10px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:${active ? t.panel : 'transparent'};color:${active ? t.text : t.muted};opacity:${enabled ? 1 : 0.4};`;
  const nav = modIds.map(id => {
    const active = o.active === id;
    const tabbable = sess && (active || (!modIds.includes(o.active) && id === 'jobs'));
    return { label: tx['Module_' + id], short: tx['Module_' + id].toUpperCase(), icon: ICONS[id],
      current: active ? 'page' : 'false', disabled: sess ? 'false' : 'true', tab: tabbable ? '0' : '-1',
      tip: sess ? tx['Module_' + id] : tx.Nav_DisabledHint, bar: active ? t.accent : 'transparent', style: itemStyle(active, sess) };
  });
  const sActive = o.active === 'settings';
  const navBottom = [{ label: tx.Nav_Settings, short: tx.Nav_Settings_Short.toUpperCase(), icon: ICONS.settings,
    current: sActive ? 'page' : 'false', disabled: 'false', tab: '0', tip: tx.Nav_Settings, bar: sActive ? t.accent : 'transparent', style: itemStyle(sActive, true) }];
  const pendText = pend === 1 ? tx.Shell_Pending_One : fmt(tx.Shell_Pending_Other, pend);
  const hasPend = sess && pend > 0;
  const bar = {
    noSessD: chips ? 'none' : 'inline', chipsD: chips ? 'flex' : 'none',
    profile: o.profile || '', save: o.save || '',
    profileAria: fmt(tx.SessionBar_ProfileAutomation, o.profile || ''), saveAria: fmt(tx.SessionBar_SaveAutomation, o.save || ''),
    chipStyle: `min-height:44px;padding:2px 10px 2px 12px;border-radius:10px;border:1px solid ${o.error ? t.danger : t.line};background:transparent;color:${t.text};display:flex;align-items:center;gap:8px;text-align:left;min-width:0;opacity:${sess || o.error ? 1 : 0.85};`,
    game: tx[o.game === 'ATS' ? 'Game_Ats_Short' : 'Game_Ets2_Short'], gameName: tx[o.game === 'ATS' ? 'Game_Ats' : 'Game_Ets2'],
    statusD: sess ? 'flex' : 'none', status: running ? tx.SessionBar_GameRunning : tx.SessionBar_GameClosed,
    statusDot: running ? t.danger : t.success, statusTip: running ? tx.SessionBar_GameRunningHint : tx.SessionBar_GameClosed,
    reviewLabel: hasPend ? fmt(tx.SessionBar_Review, pend) : tx.SessionBar_ReviewNone,
    reviewAria: hasPend ? fmt(tx.SessionBar_ReviewAutomation, pendText) : tx.SessionBar_ReviewAutomationNone,
    reviewDisabled: hasPend ? 'false' : 'true', reviewTab: hasPend ? '0' : '-1',
    reviewCurrent: o.reviewCurrent ? 'page' : 'false',
    reviewStyle: `display:${sess ? 'inline-flex' : 'none'};align-items:center;min-height:44px;padding:0 20px;border-radius:10px;font-weight:700;letter-spacing:0.03em;white-space:nowrap;font-variant-numeric:tabular-nums;` +
      (o.reviewCurrent ? `border:1px solid ${t.accent};background:${t.sel};color:${t.text};` : hasPend ? `border:none;background:${t.accent};color:${t.onAccent};` : `border:1px solid ${t.line};background:transparent;color:${t.muted};`)
  };
  const foot = { hintsD: sess ? 'flex' : 'none', applyD: o.reviewCurrent ? 'flex' : 'none', kbd: `padding:1px 6px;border-radius:6px;border:1px solid ${t.line};font-family:ui-monospace,Consolas,monospace;font-size:11px;color:${t.text};` };
  const cv = lang === 'pt'
    ? { label: 'Prévia do canvas (fora do app)', themeBtn: dark ? 'Tema claro' : 'Tema escuro', langBtn: 'English' }
    : { label: 'Canvas preview (not part of the app)', themeBtn: dark ? 'Light theme' : 'Dark theme', langBtn: 'Português' };
  const tbBtn = `min-height:24px;padding:0 10px;border-radius:6px;border:1px solid ${t.line};background:transparent;color:${t.text};font-size:12px;`;
  const tb = { label: cv.label, themeBtn: cv.themeBtn, langBtn: cv.langBtn, btn: tbBtn };
  const variants = (o.variants || []).map(v => ({ label: v.label, pressed: v.on ? 'true' : 'false', pick: v.pick,
    style: `min-height:24px;padding:0 10px;border-radius:6px;border:1px solid ${v.on ? t.accent : t.line};background:${v.on ? t.sel : 'transparent'};color:${t.text};font-size:12px;` }));
  return { t, dark, pref, lang, tx, nav, navBottom, bar, foot, tb, variants, main: { label: o.mainLabel || '' },
    pendText, pend, sess,
    toggleTheme: () => c.setState({ pref: dark ? 'light' : 'dark' }),
    toggleLang: () => c.setState({ lang: lang === 'pt' ? 'en' : 'pt' }) };
}

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pref: null, lang: 'pt', open: false, kind: 'corrupt' }; }
  renderVals() {
    const st = this.state;
    const k = st.kind;
    const variants = [['corrupt', 'Corrompido', 'Corrupt'], ['notfound', 'Não encontrado', 'Not found'], ['denied', 'Sem permissão', 'No permission']]
      .map(([id, pt, en]) => ({ label: (this.state.lang === 'pt' ? pt : en), on: k === id, pick: () => this.setState({ kind: id }) }));
    const sv = shellVals(this, { active: '', session: false, chips: true, error: true, mainLabel: STR[this.state.lang].OpenError_Corrupt_Title, game: 'ETS2', profile: 'Demo A', save: 'Save 4', variants });
    const { t, tx, lang } = sv;
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    const code = { corrupt: 'SaveCorrupt', notfound: 'SaveNotFound', denied: 'AccessDenied' }[k];
    const pre = { corrupt: 'Corrupt', notfound: 'NotFound', denied: 'AccessDenied' }[k];
    const v = { title: tx['OpenError_' + pre + '_Title'], body: tx['OpenError_' + pre + '_Body'], tipsD: k === 'corrupt' ? 'flex' : 'none',
      expanded: st.open ? 'true' : 'false', chev: st.open ? 'rotate(90deg)' : 'none', detailsD: st.open ? 'block' : 'none',
      details: k === 'corrupt' ? fmt(tx.OpenError_DetailsText, code, (18204).toLocaleString(loc)) : fmt(tx.OpenError_DetailsCode, code),
      primary: btnPrimary(t, false), secondary: btnSecondary(t) };
    return { ...sv, v, toggleDetails: () => this.setState({ open: !st.open }) };
  }
}
</script>
